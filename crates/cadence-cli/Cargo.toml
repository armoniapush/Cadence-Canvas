[package]
name = "cadence-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cadence"
path = "src/main.rs"

[dependencies]
cadence-core = { path = "../cadence-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
