[package]
name = "cadence-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "cadence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cadence-desktop"
path = "src/main.rs"

[dependencies]
cadence-core = { path = "../crates/cadence-core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.13"

[build-dependencies]
tauri-build = { version = "2", features = [] }
